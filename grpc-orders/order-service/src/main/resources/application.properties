spring.application.name=order-service

# REST API port
server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:ordersdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# gRPC channel to user-service
spring.grpc.client.channel.user-service.target=static://localhost:9090

# How long order-service waits for user-service before giving up
user-service.timeout-seconds=3
